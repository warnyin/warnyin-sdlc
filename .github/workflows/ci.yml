name: ci
# Also the release gate: release.yml calls this file (workflow_call) before publishing. So:
# no `permissions:` beyond contents: read, no job-level `if:`, no `continue-on-error`, and
# pack-verify runs on the same Node major as the publish job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these jobs as its gate

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  pack-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: pack must exclude tests and dogfood, include payload
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json"))[0].files.map(f => f.path);
            const bad = files.filter(f => f.startsWith("tests/") || f.startsWith("sdlc/") || f.startsWith("docs/") || f.startsWith(".claude/"));
            if (bad.length) { console.error("leaked into pack:", bad); process.exit(1); }
            for (const need of ["bin/cli.mjs", "lib/caps.mjs", "lib/journal.mjs", "lib/active.mjs","payload/playbook/README.md", "payload/hooks/guard-writes.mjs", "payload/adapters/claude/commands/sdlc/update.md", "bin/changelog.mjs", "CHANGELOG.md"]) {
              if (!files.includes(need)) { console.error("missing from pack:", need); process.exit(1); }
            }
            console.log("pack ok:", files.length, "files");
          '
