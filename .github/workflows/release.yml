name: release
# Publishes @warnyin/sdlc when a plain vX.Y.Z tag is pushed. npm's trusted publisher is
# bound to this filename — renaming it breaks publishing until npmjs.com is updated.
# Actions in the publish job are pinned by commit SHA: that job holds the OIDC token.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: tag names the package.json version; npm supports trusted publishing
        run: npm --version | node .github/scripts/release-check.mjs
      - name: tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: publish with provenance (OIDC, no token)
        run: npm publish --provenance --access public
